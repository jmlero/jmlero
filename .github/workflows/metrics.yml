name: GitHub Metrics

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jmlero
          filename: metrics.svg
          config_timezone: Europe/Madrid
          base: header
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%
          plugin_languages_ignored: >-
            html, css, scss, dockerfile, makefile
          experimental_features: --optimize-svg-css-injection
          extras_css: |
            svg { background-color: #0D1117 !important; }
            .items-wrapper { background-color: #0D1117 !important; color: #c9d1d9 !important; padding: 14px !important; border-radius: 6px !important; }
            h1, h2, h3 { color: #58a6ff !important; }
            text, span, div { color: #c9d1d9 !important; }
            .field { color: #c9d1d9 !important; }
            .field svg { fill: #8b949e !important; }
            .calendar .day { outline-color: rgba(201, 209, 217, 0.12) !important; }
